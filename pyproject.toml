[project]
name = "cppgraph"
version = "0.4.11"
description = "Semantically accurate code-graph for C++ from a compiler index (SCIP)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "protobuf>=7.35.1,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.10",
]
# The MCP server (`cppgraph-mcp`) needs no extra: it is a hand-rolled stdio
# JSON-RPC server over the standard library (no third-party protocol package).
# The interactive setup/index wizards render selectable menus and info panels when
# these are present; without them they fall back to plain numbered prompts.
tui = [
    "questionary>=2.0",
    "rich>=13.0",
]

[project.scripts]
cppgraph = "cppgraph.cli:main"
cppgraph-mcp = "cppgraph.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cppgraph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/cppgraph/proto"]  # generated protobuf bindings

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
